name: conventional-commits

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: conventional-commits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  valida:
    name: conventional-commits
    runs-on: ubuntu-latest
    steps:
      - name: Obtém o histórico do pull request
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Com merge por squash e "Default to PR title", este título é exatamente a
      # mensagem que fica registrada em main.
      - name: Valida o título do pull request
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITULO" | sh .github/scripts/valida-mensagem-commit.sh -

      - name: Valida cada commit do pull request
        env:
          SHA_BASE: ${{ github.event.pull_request.base.sha }}
          SHA_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          base=$(git merge-base "$SHA_BASE" "$SHA_HEAD")
          codigo=0
          for sha in $(git rev-list --no-merges "$base..$SHA_HEAD"); do
            if ! git log -1 --format=%B "$sha" | sh .github/scripts/valida-mensagem-commit.sh -; then
              printf 'commit reprovado: %s\n\n' "$sha"
              codigo=1
            fi
          done
          exit "$codigo"
